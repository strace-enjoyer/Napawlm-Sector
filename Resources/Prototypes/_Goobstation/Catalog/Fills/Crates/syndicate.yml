- type: entity
  parent: CrateSyndicate
  id: CrateSyndicateUndetermined # a crate, looks like one # Omuport Pawlm
  name: undetermined Syndicate bundle crate
  description: Contains a Syndicate bundle. Testicle your luck.
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:NestedSelector
        tableId: RandomFuckingBundleSelector
        rolls: !type:RangeNumberSelector
          range: 3, 3
          # for some reason, the selector here adds 1 to whatever value it generates,
          # so this is actually 3? what!??!?!?!?!?
  - type: StaticPrice
    price: 69

