- type: entity
  id: OrganAsakimBrain
  parent: [ OrganHumanBrain ]
  name: asakim brain
  description: A mess of flesh and silicon, veins interlaced with unknown implants and cybernetics.
  components:
  - type: Tag
    tags:
    - AsakimBrain

- type: entity
  id: OrganAsakimEyes
  parent: [ OrganHumanEyes ]
  name: asakim eyes
  description: They reflect off the darkness.
  components:
  - type: Organ
    onAdd:
    - type: NightVision # Gen 3 wide-quadtube
      relayOverlay: false
      goggleEffect: true
      viewCircleRadius: 450
      viewCircleCount: 4
      viewCircleSpacing: 340
      action: ActionToggleNightVision
      phosphorColor: "#DE579A"
      lightingColor: "#FFFFFF32"

