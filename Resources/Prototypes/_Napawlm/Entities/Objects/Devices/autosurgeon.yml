- type: entity
  parent: BaseNFFlatpack
  id: AutosurgeonSandevistanSyndicateFlatpack
  name: Syndicate autosurgeon (sandevistan) flatpack
  description: A flatpack used for constructing a Syndicate autosurgeon.
  components:
  - type: Flatpack
    entity: AutosurgeonSandevistan
  - type: StaticPrice
    price: 50000
  - type: Sprite
    layers:
    - state: medical_lathe

