  id: AutosurgeonLeftPistolCobra
  name: syndicate autosurgeon (left gunner arm)
  description: A single-use autosurgeon for replacing or upgrading your parts with cybernetic implants. This specific model of the gunner arm actually doesnt self-recharge, sadly.
